  # ==================== GATEWAY RESPONSES (CORS for errors) ====================

  # Add CORS headers to 4xx responses (including 401 Unauthorized from authorizer)
  GatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # Add CORS headers to 5xx responses
  GatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # Specifically handle unauthorized responses from custom authorizer
  GatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      StatusCode: '401'

  # Handle access denied (403) responses
  GatewayResponseAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      StatusCode: '403'

  # ==================== SECRETS MANAGER ====================

  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub buildertrend/${Environment}/jwt
      Description: JWT Secret for authentication
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludePunctuation: true

# ==================== OUTPUTS ====================

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL (use this in your web/.env as VITE_API_URL)
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/api
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  FileStorageBucketName:
    Description: S3 bucket for file storage
    Value: !Ref FileStorageBucket
    Export:
      Name: !Sub ${AWS::StackName}-FileStorageBucket

  UsersTableName:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable

  ProjectsTableName:
    Description: DynamoDB Projects table name
    Value: !Ref ProjectsTable

  InvoicesTableName:
    Description: DynamoDB Invoices table name
    Value: !Ref InvoicesTable
